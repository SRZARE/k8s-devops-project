apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: urlshort
data:
  APP_VERSION: "v1"
  REDIS_HOST: "redis"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener
  namespace: urlshort
spec:
  replicas: 2
  selector:
    matchLabels:
      app: url-shortener
  template:
    metadata:
      labels:
        app: url-shortener
    spec:
      containers:
        - name: app
          image: sham22/url-shortener:v1
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
---
apiVersion: v1
kind: Service
metadata:
  name: url-shortener
  namespace: urlshort
spec:
  type: NodePort
  selector:
    app: url-shortener
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
